; Opcache: kode tidak pernah berubah di dalam image, jadi validasi timestamp dimatikan.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0

; Batas upload dokumen kendaraan. nginx frontend membatasi di 6m, disamakan di sini.
upload_max_filesize=6M
post_max_size=8M
memory_limit=256M

expose_php=Off
